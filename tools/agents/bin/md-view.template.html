<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan view</title>
<!-- Generated by md-view.sh from {{SRC}}. Do not edit. Agents: read {{SRC}}, not this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --paper:#F3F5F1;--ink:#1A1D1B;--ink-2:#4A524D;--form:#3D5A4C;--rule:#C3CEC6;--rule-2:#DDE4DF;
  --margin:#D9827A;--agent:#2B4C9B;--claude:#A84F2A;--user:#2C7038;--pencil:#646B67;
  --g:2.75rem;--gap:1.25rem;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --face:"Archivo",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121614;--ink:#E5E9E6;--ink-2:#A9B2AC;--form:#9DB8A9;--rule:#34403A;--rule-2:#232B27;
  --margin:#9A5048;--agent:#93AEF2;--claude:#E79A73;--user:#8ACB94;--pencil:#9AA19C;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121614;--ink:#E5E9E6;--ink-2:#A9B2AC;--form:#9DB8A9;--rule:#34403A;--rule-2:#232B27;
  --margin:#9A5048;--agent:#93AEF2;--claude:#E79A73;--user:#8ACB94;--pencil:#9AA19C;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);scrollbar-color:var(--rule) transparent;caret-color:var(--agent)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--agent) 24%,transparent)}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px;border-radius:2px}
a{color:inherit;text-decoration-color:var(--form);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
p,ul,ol,dl{margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lbl{font:600 .72rem/1.2 var(--face);font-stretch:82%;letter-spacing:.09em;text-transform:uppercase;color:var(--form)}
.o-agent{color:var(--agent)}.o-claude{color:var(--claude)}.o-user{color:var(--user)}.o-form{color:var(--form)}
.unk{color:var(--pencil);font-style:italic;text-decoration:underline dashed 1px;text-underline-offset:3px}

.wrap{max-width:80rem;margin:0 auto;padding:1.75rem 2rem 3rem}

/* Notebook header: a printed form strip. */
.head{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto auto;border:1px solid var(--form);border-top-width:2px}
.head .repo{font:650 .95rem/1.3 var(--face);font-stretch:85%}
.head>div{padding:.55rem 1rem .7rem;border-left:1px solid var(--rule)}
.head>div:first-child{border-left:0}
.head .val{margin-top:.3rem;font-size:.95rem;line-height:1.3;white-space:nowrap}
.head h1{margin:.3rem 0 0;font:650 1.2rem/1.25 var(--face);font-stretch:85%;letter-spacing:-.005em;text-wrap:balance}
.head .hash{font-family:var(--mono);font-size:.85rem}

.layout{display:grid;grid-template-columns:12.5rem minmax(0,1fr);gap:2.25rem;margin-top:1.75rem}

/* Contents with tally marks. */
.contents{position:sticky;top:1.25rem;align-self:start}
.contents ol{list-style:none;margin:.55rem 0 0;padding:0;border-top:1px solid var(--rule)}
.contents a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .5rem;padding:.5rem 0 .55rem;border-bottom:1px solid var(--rule-2);color:var(--ink);text-decoration:none;font-size:.95rem;line-height:1.3}
.contents a:hover .nm{text-decoration:underline;text-underline-offset:3px}
.contents a[aria-current="true"] .nm{font-weight:650;color:var(--form)}
.contents .frac{font-size:.78rem;color:var(--ink-2)}
.tally{grid-column:1/-1;display:block;height:12px;overflow:visible}
.tally line{stroke-width:1.3;stroke-linecap:round}

/* The sheet: a margin gutter, one margin rule, then the column. */
.sheet{position:relative;padding-left:calc(var(--g) + var(--gap));min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:var(--g);width:1.5px;background:var(--margin)}
.gutter{position:absolute;inset:0 auto 0 0;width:var(--g);pointer-events:none}
.gm{position:absolute;left:calc(50% - 8px);width:16px;height:16px;display:block}
.gm svg{width:100%;height:100%;display:block}
.gm.flag{left:calc(50% - 10px);width:20px;height:20px}
@media (prefers-reduced-motion:no-preference){.gm.flag{animation:land .7s cubic-bezier(.16,1,.3,1) .15s both}}
@keyframes land{from{transform:translateX(-14px)}to{transform:none}}
.gutter.settled .gm.flag{animation:none}


.nb{white-space:nowrap}

.loop{margin-top:2rem;border-top:2px solid var(--form);padding-top:.7rem}
.loop-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1rem;align-items:baseline}
.lanes{position:relative;display:grid;column-gap:1.6rem;row-gap:.55rem;margin-top:.8rem}
.lanes.v{column-gap:.8rem;row-gap:1.1rem}
.lane-btn{align-self:center;font:650 .78rem/1.2 var(--face);font-stretch:85%;letter-spacing:.06em;text-transform:uppercase;padding:.3rem 0}
.lane-btn .turn{display:block;font:500 .74rem/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.lane-rule{align-self:center;border-top:1px dashed var(--rule);height:0}
.lanes.v .lane-rule{border-top:0;border-left:1px dashed var(--rule);height:auto;width:0;justify-self:center}
.lanes.v .lane-btn{justify-self:center;text-align:center}
.step{position:relative;z-index:1;align-self:center;background:var(--paper);border:1px solid currentColor;padding:.35rem .5rem .4rem;font-size:.84rem;line-height:1.25}
.step .no{display:block;font:650 .72rem/1.2 var(--face);letter-spacing:.06em;color:var(--form)}
.step .nm{color:var(--ink)}
.wire{position:absolute;inset:0;overflow:visible;pointer-events:none}
.wire path{fill:none;stroke:var(--form);stroke-width:1}
.loop-foot{margin-top:.6rem;font-size:.8rem;color:var(--ink-2)}

.facts{margin-top:2rem;border-top:1px solid var(--rule);display:grid;grid-template-columns:7rem minmax(0,1fr)}
.facts>div{display:contents}
.facts dt,.facts dd{padding:.6rem 0;border-bottom:1px solid var(--rule-2)}
.facts dt{padding-top:.75rem}
.facts dd{margin:0}
.facts .m{max-width:72ch}
#brief>.facts:first-child{margin-top:0}
.facts dd ul{columns:2 18rem;column-gap:2rem;padding-left:1.1rem;margin:0}
.facts dd li{break-inside:avoid;margin:0 0 .2rem}

/* Sections. */
.sec{margin-top:3rem;scroll-margin-top:1rem}
.sec>h2{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:0 0 .25rem;padding:.15rem .4rem .4rem 0;border-bottom:1px solid var(--form);font:650 1.35rem/1.25 var(--face);font-stretch:80%;letter-spacing:-.005em}
.sec>h2 .t{font:500 .8rem var(--sans);color:var(--ink-2);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sec.arrive>h2{animation:ink 1.4s cubic-bezier(.16,1,.3,1)}}
@keyframes ink{from{background:color-mix(in srgb,var(--margin) 22%,transparent)}to{background:transparent}}
.sec h3{margin:1.6rem 0 .45rem}
.sec p{margin:.6rem 0;max-width:72ch}
.sec ul:not(.ledger),.sec ol{padding-left:1.25rem;margin:.4rem 0 .8rem;max-width:72ch}
.sec li{margin:.25rem 0}
code{font-family:var(--mono);font-size:.86em;background:color-mix(in srgb,var(--form) 10%,transparent);padding:.06em .3em;border-radius:3px;overflow-wrap:break-word}
pre{position:relative;margin:.8rem 0;padding:.8rem 5rem .8rem .95rem;border:1px solid var(--rule);font:.86rem/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
pre code{background:none;padding:0;font-size:inherit}
.copy{position:absolute;top:.5rem;right:.5rem;font:650 .72rem/1 var(--face);letter-spacing:.08em;text-transform:uppercase;color:var(--form);background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:.35rem .55rem;cursor:pointer}
.copy:hover{border-color:var(--form)}

/* Ledger: one fixed slot grid for every entry. */
.ledger-head,.row{display:grid;grid-template-columns:minmax(0,1.6fr) 6.5rem minmax(0,1fr) minmax(0,1fr);gap:.2rem 1.25rem}
.ledger-head{margin-top:.6rem;padding:.35rem 0;border-bottom:1px solid var(--rule)}
.ledger{list-style:none;padding:0;margin:0 0 .8rem}
.row{margin:0;padding:.6rem 0 .65rem;border-bottom:1px solid var(--rule-2);font-size:.95rem;line-height:1.45}
.row .c{font-size:.85rem;color:var(--ink-2)}
.row .cl{display:none}
.row.bare .text{grid-column:1/-1}
.row.done .text{color:var(--ink-2)}
.row.is-next .text{font-weight:600}
.board .ledger-head{margin-top:0}
.band{display:flex;justify-content:space-between;align-items:baseline;margin:1.75rem 0 0;padding:.45rem 0 .35rem;border-top:2px solid var(--form);font:700 .95rem/1.2 var(--face);font-stretch:80%;letter-spacing:.06em;text-transform:uppercase;color:var(--form)}
.board .ledger-head+.band{margin-top:.2rem}
.band .n{font:500 .8rem var(--sans);letter-spacing:0;color:var(--ink-2)}
.band.done{color:var(--ink-2);border-top-color:var(--rule)}
.band-hint{margin:.3rem 0 .2rem;font-size:.8rem;color:var(--ink-2)}
.board .none{margin:.4rem 0 0;font-size:.95rem;color:var(--ink-2)}
.row .num{margin-right:.4rem;color:var(--ink-2)}
.row .src{display:block;margin-top:.15rem;font-size:.8rem;color:var(--ink-2);font-weight:400}
.unk-list{list-style:none;margin:0;padding:0}
.unk-list .src{display:block;margin-top:.15rem;font-size:.8rem;color:var(--ink-2)}
.sec ol.ledger,.sec ul.unk-list,.sec ol.smap{padding-left:0;max-width:none}
.sec ol.ledger,.sec ul.unk-list{margin:0}
.unk-list li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--rule-2);font-size:.95rem}
.unk-list svg{width:14px;height:14px;margin-top:.25rem}
.smap{list-style:none;margin:.7rem 0 .4rem;padding:0;display:flex;flex-wrap:wrap;gap:.8rem 1.5rem}
.sm{position:relative;width:8.75rem}
.sm:not(:last-child)::after{content:"";position:absolute;top:50%;right:-1.2rem;width:.95rem;border-top:1px solid var(--form)}
.sm:not(:last-child)::before{content:"";position:absolute;top:calc(50% - 4px);right:-1.25rem;border:4px solid transparent;border-left:5px solid var(--form);border-right:0}
.sm a{display:grid;align-content:start;gap:.2rem;height:100%;padding:.45rem .6rem .5rem;border:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:.8rem;line-height:1.3}
.sm a:hover{border-color:var(--form)}
.sm-n{font:650 .72rem/1.2 var(--face);letter-spacing:.05em;text-transform:uppercase;color:var(--form)}
.sm-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sm-o{font-size:.72rem}
.sm.done a{background:color-mix(in srgb,var(--form) 7%,transparent)}
.sm.done .sm-t{text-decoration:line-through;text-decoration-color:var(--ink-2);color:var(--ink-2)}
.sm.todo a{border-style:dashed;border-color:var(--form)}
.sm.now a{border:2px solid currentColor}
.sm.now .sm-n{color:currentColor}
.row.done .tx{text-decoration:line-through;text-decoration-color:var(--ink-2)}
.now-tag{margin-left:.6rem;padding:.05rem .4rem;border:1px solid currentColor;font:650 .72rem/1.4 var(--face);letter-spacing:.06em;text-transform:uppercase;vertical-align:.2em}
.ledger.stack .row.is-next .tx{font:640 1.35rem/1.2 var(--face);font-stretch:80%}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.9rem}
.split>div{border:1px solid var(--rule);padding:.15rem .9rem .3rem}
.split h3{margin:.6rem 0 .2rem}
/* Tables, the "Waiting on you" list, and diagrams. */
.tbl{overflow-x:auto;max-width:100%;margin:.7rem 0}
.sec table{border-collapse:collapse;min-width:100%;font-size:.92rem;line-height:1.45}
.sec th,.sec td{padding:.45rem .9rem .45rem 0;border-bottom:1px solid var(--rule-2);text-align:left;vertical-align:top}
.sec th{font:600 .72rem/1.2 var(--face);font-stretch:82%;letter-spacing:.09em;text-transform:uppercase;color:var(--form);border-bottom-color:var(--rule)}
.you-list{list-style:none;margin:.3rem 0 0;padding:0}
.sec ul.you-list{padding-left:0;max-width:none}
.you-list li{padding:.45rem 0;border-bottom:1px solid var(--rule-2);font-size:.95rem}
.you-list .num{margin-right:.4rem;color:var(--ink-2)}
.mermaid{margin:.9rem 0;padding:.8rem;border:1px solid var(--rule);overflow-x:auto;text-align:center}
.mermaid:not([data-processed]){white-space:pre-wrap;text-align:left;font:.86rem/1.55 var(--mono)}


footer{margin-top:3.5rem;padding-top:.8rem;border-top:1px solid var(--rule);font-size:.8rem;color:var(--ink-2)}

@media (max-width:1023px){
  .layout{grid-template-columns:minmax(0,1fr);gap:1.25rem}
  .contents{position:static}
  .contents ol{display:flex;flex-wrap:wrap;gap:0 1.5rem;border-top:0}
  .contents a{border-bottom:0;padding:.3rem 0}
}
@media (max-width:719px){
  :root{--g:1.6rem;--gap:.8rem}
  .wrap{padding:1rem 1rem 2.5rem}
  .head{grid-template-columns:repeat(3,minmax(0,1fr))}
  .head>div,.head>div:first-child{border-left:0;border-top:1px solid var(--rule-2);padding:.45rem .75rem .5rem}
  .head>div.title{grid-column:1/-1;order:-1;border-top:0}
  .head h1{font-size:1.2rem}
  .gm{left:calc(50% - 7px);width:14px;height:14px}
  .gm.flag{left:calc(50% - 8px);width:16px;height:16px}
  .ledger-head{display:none}
  .row{grid-template-columns:minmax(0,1fr)}
  .row .c{display:block}
  .row .cl{display:inline;margin-right:.4rem}
  .split{grid-template-columns:1fr}
  .smap{gap:.7rem 1.1rem}
  .sm{width:calc(50% - .55rem)}
  .sm:nth-child(2n)::after,.sm:nth-child(2n)::before{display:none}
  .sm:not(:last-child)::after{right:-.95rem;width:.7rem}
  .sm:not(:last-child)::before{right:-1rem}
  .facts{grid-template-columns:minmax(0,1fr)}
  .facts dt{padding-bottom:0;border-bottom:0}
  pre{padding-right:.95rem;padding-top:2.4rem}
}
</style>
</head>
<body data-hash="{{HASH}}" data-repo="{{REPO}}">
<script type="text/plain" id="src">{{MD}}</script>
<div class="wrap">
  <header class="head">
    <div><span class="lbl">Repo</span><div class="val repo" title="{{PATH}}">{{REPO}}</div></div>
    <div><span class="lbl">Kind</span><div class="val" id="kind"></div></div>
    <div class="title"><span class="lbl">Title</span><h1 id="title"></h1></div>
    <div><span class="lbl">Status</span><div class="val" id="status"></div></div>
    <div><span class="lbl">Dated</span><div class="val" id="dated"></div></div>
    <div><span class="lbl">Entries done</span><div class="val" id="count"></div></div>
    <div><span class="lbl">Page</span><div class="val hash">{{HASH}}</div></div>
  </header>
  <div class="layout">
    <nav class="contents" aria-label="Contents"><span class="lbl">Contents</span><ol id="toc"></ol></nav>
    <main class="sheet" id="sheet">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <section id="brief" class="sec" style="margin-top:0" aria-label="Brief"></section>
      <div id="sections"></div>
      <footer>Generated from {{PATH}} in {{REPO}} by md-view.sh · built {{BUILT}} · page {{HASH}} (source + template). Agents: edit {{SRC}}, then rebuild. Never edit this page.</footer>
    </main>
  </div>
</div>
<script>
const raw = document.getElementById('src').textContent.replace(/<\\\/script/g, '</script');
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
const strip = h => h.replace(/<[^>]+>/g, '');
const cap = s => s.replace(/^./, c => c.toUpperCase());
marked.use({ gfm: true, breaks: true });

// Front matter.
const fm = {}; let body = raw;
const m = raw.match(/^---\n([\s\S]*?)\n---\n?/);
if (m) { body = raw.slice(m[0].length); m[1].split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) fm[l.slice(0, i).trim()] = l.slice(i + 1).trim(); }); }
// The repo name leads the tab title, so pages from different repos are easy to tell apart.
const REPO = document.body.dataset.repo;
document.title = (REPO ? REPO + ' · ' : '') + (fm.title || 'Plan view');
$('#title').textContent = fm.title || 'Untitled';
$('#kind').textContent = (fm.kind || 'doc').replace(/^./, c => c.toUpperCase());
$('#status').textContent = fm.status || '—';
$('#dated').textContent = fm.updated || '—';

// Sections by H2, ignoring headings inside code fences.
const secs = [{ name: '', md: '' }]; let fence = false;
body.split('\n').forEach(l => {
  if (/^\s*```/.test(l)) fence = !fence;
  const h = !fence && l.match(/^## (.+)/);
  if (h) secs.push({ name: h[1].trim(), md: '' }); else secs[secs.length - 1].md += l + '\n';
});
const intro = secs.shift();
const loop = secs.find(s => /^loop$/i.test(s.name));
const parts = secs.filter(s => s !== loop);

// Owners: Claude, user, else agent.
const LANES = ['agent', 'claude', 'user'];
const NAMES = { agent: 'Agent', claude: 'Claude', user: 'User' };
const ownerKey = o => /claude/i.test(o) ? 'claude' : /\buser\b/i.test(o) ? 'user' : 'agent';
const ownerKeys = s => [...new Set(s.split(/,|\/|&|\+|\band\b/).map(x => x.trim()).filter(Boolean).map(ownerKey))];
const ownerHTML = h => h.split(/(,\s*)/).map(p => /^,\s*$/.test(p) ? p : `<span class="o-${ownerKey(strip(p))}">${p}</span>`).join('');
const own = keys => keys.map(k => 'own-' + k).join(' ');

// Split "a · b · c" outside code spans.
function splitDots(html) {
  const keep = [];
  const h = html.replace(/<code>[\s\S]*?<\/code>/g, c => `\u0000${keep.push(c) - 1}\u0000`);
  return h.split(/\s+·\s+/).map(p => p.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[i]).trim());
}

const MARK = {
  open: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  done: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1" fill="currentColor"/><path d="M5 8.3l2.1 2.1L11.2 5.8" fill="none" style="stroke:var(--paper)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  next: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 2v16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4.8 3h11.4l-3.3 4 3.3 4H4.8z" fill="currentColor"/></svg>',
  unk: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 1.7"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".85" fill="currentColor"/></svg>'
};

// Render sections; turn task items into ledger rows.
const entries = [], unknowns = [];
const host = $('#sections');
parts.forEach(sec => {
  sec.id = 's-' + slug(sec.name);
  const el = document.createElement('section');
  el.className = 'sec'; el.id = sec.id;
  el.innerHTML = `<h2><span>${esc(sec.name)}</span><span class="t"></span></h2>` + marked.parse(sec.md);
  el.querySelectorAll('li').forEach(li => {
    const cb = li.querySelector(':scope > input[type=checkbox], :scope > p > input[type=checkbox]');
    if (!cb) return;
    const done = cb.checked; cb.remove();
    const f = splitDots((li.querySelector(':scope > p') || li).innerHTML.trim());
    const [text, owner = '', check = '', back = ''] = f;
    const keys = owner ? ownerKeys(strip(owner)) : [];
    const id = 'e-' + (entries.length + 1);
    li.id = id;
    li.className = `row ${done ? 'done' : 'open'} ${own(keys)}${f.length > 1 ? '' : ' bare'}`;
    li.innerHTML = `<span class="vh">${done ? 'Done:' : 'Open:'} </span><span class="text">${text}</span>` + (f.length > 1
      ? `<span class="c"><span class="cl lbl">Owner</span>${ownerHTML(owner)}</span><span class="c"><span class="cl lbl">Check</span>${check}</span><span class="c"><span class="cl lbl">Rollback</span>${back}</span>` : '');
    entries.push({ id, el: li, sec, done, keys, text, owner, check, back });
  });
  el.querySelectorAll('ul').forEach(ul => {
    const lis = [...ul.children];
    if (!lis.length || !lis.every(x => x.classList.contains('row'))) return;
    ul.classList.add('ledger');
    if (lis.some(x => !x.classList.contains('bare')))
      ul.insertAdjacentHTML('beforebegin', '<div class="ledger-head" aria-hidden="true"><span class="lbl">Entry</span><span class="lbl">Owner</span><span class="lbl">Check</span><span class="lbl">Rollback</span></div>');
  });
  // "Always loaded" and "On demand" side by side.
  const hs = [...el.querySelectorAll('h3')];
  const a = hs.find(h => /^always loaded$/i.test(h.textContent.trim())), d = hs.find(h => /^on demand$/i.test(h.textContent.trim()));
  if (a && d && a.nextElementSibling && d.nextElementSibling) {
    const grid = document.createElement('div'); grid.className = 'split'; a.before(grid);
    [a, d].forEach(h => { const box = document.createElement('div'); const list = h.nextElementSibling; box.append(h, list); grid.append(box); });
  }
  el.querySelectorAll('h3').forEach(h => h.classList.add('lbl'));
  // Collect unknowns before marking them in pencil.
  el.querySelectorAll('li, p').forEach(n => {
    if (n.closest('pre') || n.querySelector('li')) return;
    const t = [...n.childNodes].filter(c => !(c.nodeType === 1 && c.matches('code, .vh'))).map(c => c.textContent).join(' ');
    if (!/\bunknown\b/.test(t)) return;
    const id = n.id || (n.id = 'u-' + (unknowns.length + 1));
    unknowns.push({ id, el: n, sec, html: n.classList.contains('row') ? n.querySelector('.text').innerHTML : n.innerHTML });
  });
  const done = entries.filter(e => e.sec === sec && e.done).length, all = entries.filter(e => e.sec === sec).length;
  sec.done = done; sec.all = all;
  if (all) el.querySelector('h2 .t').textContent = `${done} done · ${all - done} open`;
  sec.el = el; host.append(el);
});

const open = entries.filter(e => !e.done);
const next = open[0];
const doneAll = entries.length - open.length;
$('#count').textContent = entries.length ? `${doneAll} of ${entries.length}` : '—';
if (next) next.el.classList.add('is-next');

// Brief: one progress board; every entry appears once, in Now, Next, or Done.
let brief = '<div id="board" class="board"></div>';

// Loop as owner lanes.
const steps = loop ? loop.md.split('\n').map(l => l.match(/^\s*\d+\.\s+(.+?)\s+·\s+(.+?)\s*$/)).filter(Boolean).map(s => ({ name: s[1], key: ownerKey(s[2]), owner: s[2] })) : [];
const lanes = LANES.filter(k => steps.some(s => s.key === k) || (next && next.keys[0] === k && steps.length));
// The agent lane shows the real owner names (for example "Codex, Cursor"), not just "Agent".
const laneName = k => (k === 'agent' && [...new Set(steps.filter(s => s.key === k).map(s => cap(strip(s.owner))))].join(', ')) || NAMES[k];
if (steps.length) {
  brief += `<div class="loop"><div class="loop-head"><span class="lbl">${esc(loop.name)} · who acts when</span></div>
    <div class="lanes" id="lanes">${lanes.map(k => `<span class="lane-btn o-${k}">${esc(laneName(k))}${next && next.keys[0] === k ? '<span class="turn">has the next step</span>' : ''}</span><span class="lane-rule" aria-hidden="true"></span>`).join('')}
    ${steps.map((s, i) => `<div class="step o-${s.key} own-${s.key}" data-lane="${lanes.indexOf(s.key)}"><span class="no">Step ${i + 1}</span><span class="nm">${marked.parseInline(s.name)}</span><span class="vh"> · ${esc(s.owner)}</span></div>`).join('')}
    <svg class="wire" aria-hidden="true"><path/></svg></div>
    <p class="loop-foot">After step ${steps.length}, the loop starts again at step 1.</p></div>`;
}

// Intro lines "Label: value" become a fact table; "a · b · c" values become lists.
function renderIntro(md) {
  let out = '', buf = [], dl = [], fence = false;
  const flushMd = () => { if (buf.join('').trim()) out += `<div class="sec-intro">${marked.parse(buf.join('\n'))}</div>`; buf = []; };
  const flushDl = () => { if (dl.length) out += `<dl class="facts">${dl.join('')}</dl>`; dl = []; };
  md.split('\n').forEach(l => {
    if (/^\s*```/.test(l)) fence = !fence;
    const k = !fence && l.match(/^([A-Z][A-Za-z ]{0,24}):\s+(.+)$/);
    if (k) {
      flushMd();
      const p = splitDots(marked.parseInline(k[2]));
      dl.push(`<div><dt class="lbl">${esc(k[1])}</dt><dd><div class="m">${p.length > 2 ? `<ul>${p.map(x => `<li>${x}</li>`).join('')}</ul>` : p.join(' · ')}</div></dd></div>`);
    } else { flushDl(); buf.push(l); }
  });
  flushMd(); flushDl();
  return out;
}
// Every front matter key shows; only kind, title, status, and updated have a header slot.
const extra = Object.keys(fm).filter(k => !['kind', 'title', 'status', 'updated'].includes(k)).map(k => `${cap(k)}: ${fm[k]}`);
// Facts (Summary, Goal) come first, so the user reads the context before the steps.
brief = renderIntro(extra.concat(intro.md).join('\n')) + brief;
$('#brief').innerHTML = brief;
const board = $('#board'), multi = new Set(entries.map(e => e.sec)).size > 1;
// Take the ledgers out of their sections; drop a heading or section left empty.
document.querySelectorAll('#sections .ledger').forEach(ul => {
  const head = ul.previousElementSibling?.classList.contains('ledger-head') ? ul.previousElementSibling : null;
  const lbl = (head || ul).previousElementSibling;
  head?.remove(); ul.remove();
  if (lbl?.tagName === 'H3' && (!lbl.nextElementSibling || lbl.nextElementSibling.tagName === 'H3')) lbl.remove();
});
parts.forEach(sec => { sec.el.querySelector('h2 .t').textContent = ''; if (sec.el.children.length < 2) { sec.el.remove(); sec.gone = true; } });
// One order for everything: done steps first, then open steps; numbers run on.
const order = [...entries.filter(e => e.done), ...open];
order.forEach((e, i) => { e.n = i + 1; });
if (entries.length) {
  const k = e => e.keys[0] || 'form';
  // What needs the user: open user steps, then a pointer to the unconfirmed facts.
  const mine = open.filter(e => e.keys.includes('user'));
  board.insertAdjacentHTML('beforeend', `<h2 class="band"><span>Waiting on you</span><span class="n">${mine.length} open</span></h2>` + (mine.length
    ? `<ul class="you-list">${mine.map(e => `<li><a href="#${e.id}"><span class="num">${e.n}.</span>${strip(e.text)}</a></li>`).join('')}</ul>`
    : '<p class="none">Nothing is waiting on you.</p>') + (unknowns.length ? `<p class="band-hint"><a href="#unknowns">${unknowns.length} not yet confirmed</a>: check these before you rely on the plan.</p>` : ''));
  board.insertAdjacentHTML('beforeend', `<h2 class="band"><span>Slice map</span><span class="n">${doneAll} of ${entries.length} done</span></h2>
    <ol class="smap">${order.map(e => `<li class="sm ${e.done ? 'done' : e === next ? 'now o-' + k(e) : 'todo'} ${own(e.keys)}"><a href="#${e.id}" title="${esc(strip(e.text))}"><span class="sm-n">${e.n}${e === next ? ' · now' : ''}</span><span class="sm-t">${strip(e.text)}</span><span class="sm-o o-${k(e)}">${strip(e.owner) || '—'}</span></a></li>`).join('')}</ol>
    <h2 class="band"><span>Steps, in order</span><span class="n">struck = done</span></h2>
    <div class="ledger-head" aria-hidden="true"><span class="lbl">Step</span><span class="lbl">Owner</span><span class="lbl">Check</span><span class="lbl">Rollback</span></div>`);
  const ol = document.createElement('ol'); ol.className = 'ledger stack';
  order.forEach(e => {
    const t = e.el.querySelector('.text');
    t.innerHTML = `<span class="num">${e.n}.</span><span class="tx">${t.innerHTML}</span>${e === next ? '<span class="now-tag">Now</span>' : ''}` + (multi ? `<span class="src">${esc(e.sec.name)}</span>` : '');
    ol.append(e.el);
  });
  board.append(ol);
  board.insertAdjacentHTML('beforeend', `<h2 class="band unknowns" id="unknowns"><span>Not yet confirmed</span><span class="n">${unknowns.length}</span></h2><p class="band-hint">Facts the plan relies on that nobody has checked yet (written <code>unknown</code> in the .md).</p>` + (unknowns.length
    ? `<ul class="unk-list">${unknowns.map(u => `<li><span style="color:var(--pencil)">${MARK.unk}</span><span>${u.html}<span class="src">${esc(u.sec.name)}</span></span></li>`).join('')}</ul>`
    : '<p class="none">No unknowns recorded.</p>'));
}

// Contents with tally marks: four strokes and a fifth across; open entries stay faint.
function tally(done, total) {
  const n = Math.min(total, 40); let l = '';
  for (let i = 0; i < n; i++) {
    const g = Math.floor(i / 5) * 19, k = i % 5, c = i < done ? 'var(--form)' : 'color-mix(in srgb,var(--ink-2) 50%,transparent)';
    l += k < 4 ? `<line x1="${g + 1 + k * 3.6}" y1="1" x2="${g + 1 + k * 3.6}" y2="11" style="stroke:${c}"/>` : `<line x1="${g - .5}" y1="9.5" x2="${g + 13.3}" y2="2.5" style="stroke:${c}"/>`;
  }
  return `<svg class="tally" width="${Math.ceil(n / 5) * 19}" viewBox="0 0 ${Math.ceil(n / 5) * 19} 12" aria-hidden="true">${l}</svg>`;
}
const toc = $('#toc');
const tocItems = [{ id: 'brief', name: entries.length ? 'Progress' : 'Brief', done: doneAll, all: entries.length }, ...parts.filter(s => !s.gone).map(s => ({ id: s.id, name: s.name }))];
toc.innerHTML = tocItems.map(s => `<li><a href="#${s.id}" data-sec="${s.id}"><span class="nm">${esc(s.name)}</span>${s.all ? `<span class="frac">${s.done}/${s.all}</span>${tally(s.done, s.all)}` : ''}</a></li>`).join('');
toc.addEventListener('click', ev => {
  const a = ev.target.closest('a'); if (!a) return;
  const sec = document.getElementById(a.dataset.sec);
  sec.classList.remove('arrive'); void sec.offsetWidth; sec.classList.add('arrive');
});
const spy = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  toc.querySelectorAll('a').forEach(a => a.setAttribute('aria-current', String(a.dataset.sec === e.target.id)));
}), { rootMargin: '-10% 0px -75% 0px' });
document.querySelectorAll('#brief, .sec[id^="s-"]').forEach(s => spy.observe(s));

// Wide tables scroll inside the column.
document.querySelectorAll('.sec table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.before(w); w.append(t); });

// ```mermaid blocks become diagrams. If the script fails to load or a diagram fails, its source text stays visible.
const diagrams = [...document.querySelectorAll('pre > code.language-mermaid')].map(c => {
  const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent; c.parentElement.replaceWith(d); return d;
});
if (diagrams.length) {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.1/mermaid.min.js';
  s.onload = async () => {
    const t = document.documentElement.dataset.theme, dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict' });
    for (const [i, d] of diagrams.entries()) {
      try { d.innerHTML = (await mermaid.render('mmd' + i, d.textContent)).svg; d.dataset.processed = 'true'; }
      catch { document.getElementById('dmmd' + i)?.remove(); d.insertAdjacentHTML('afterbegin', '<span class="lbl">Diagram failed to render. Source:</span>\n'); }
    }
    requestAnimationFrame(layout);
  };
  document.head.append(s);
}

// Pencil every "unknown" outside code.
const walker = document.createTreeWalker($('#sheet'), NodeFilter.SHOW_TEXT); const hits = [];
while (walker.nextNode()) { const n = walker.currentNode; if (/\bunknown\b/.test(n.nodeValue) && !n.parentElement.closest('pre, code, .unk, .vh, .mermaid')) hits.push(n); }
hits.forEach(n => { const s = document.createElement('span'); s.innerHTML = esc(n.nodeValue).replace(/\bunknown\b/g, '<span class="unk">unknown</span>'); n.replaceWith(...s.childNodes); });

// Paths in inline code break only after "/" or before ".".
document.querySelectorAll('#sheet :not(pre) > code').forEach(c => {
  const t = c.textContent, segs = t.length > 18 ? t.split(/(?<=\/)|(?<=.)(?=\.)/) : [t];
  c.innerHTML = segs.map(x => `<span class="nb">${esc(x)}</span>`).join('<wbr>');
});

// Copy buttons on code blocks.
document.querySelectorAll('.sec pre').forEach(pre => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'Copy';
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(pre.querySelector('code')?.innerText ?? pre.innerText); b.textContent = 'Copied'; }
    catch { b.textContent = 'Select and copy'; }
    setTimeout(() => b.textContent = 'Copy', 1600);
  };
  pre.append(b);
});

// Layout: lanes (rows on wide screens, columns on narrow), wire, and margin marks.
const narrow = matchMedia('(max-width: 640px)');
function layoutLanes() {
  const box = $('#lanes'); if (!box) return;
  const v = narrow.matches, n = steps.length;
  box.classList.toggle('v', v);
  box.style.gridTemplateColumns = v ? `repeat(${lanes.length}, minmax(0,1fr))` : `5.5rem repeat(${n}, minmax(0,1fr))`;
  box.style.gridTemplateRows = v ? `auto repeat(${n}, auto)` : `repeat(${lanes.length}, minmax(3.4rem, auto))`;
  box.querySelectorAll('.lane-btn').forEach((b, i) => { b.style.gridRow = v ? 1 : i + 1; b.style.gridColumn = v ? i + 1 : 1; });
  box.querySelectorAll('.lane-rule').forEach((r, i) => { r.style.gridRow = v ? `2 / span ${n}` : i + 1; r.style.gridColumn = v ? i + 1 : `2 / span ${n}`; });
  box.querySelectorAll('.step').forEach((s, i) => { const l = +s.dataset.lane; s.style.gridColumn = v ? l + 1 : i + 2; s.style.gridRow = v ? i + 2 : l + 1; });
  const o = box.getBoundingClientRect(), r = [...box.querySelectorAll('.step')].map(s => s.getBoundingClientRect());
  let d = '';
  for (let i = 0; i < r.length - 1; i++) {
    const a = r[i], b = r[i + 1];
    if (v) { const x1 = a.left + a.width / 2 - o.left, y1 = a.bottom - o.top, x2 = b.left + b.width / 2 - o.left, y2 = b.top - o.top, ym = (y1 + y2) / 2; d += `M${x1} ${y1}V${ym}H${x2}V${y2}`; }
    else { const x1 = a.right - o.left, y1 = a.top + a.height / 2 - o.top, x2 = b.left - o.left, y2 = b.top + b.height / 2 - o.top, xm = (x1 + x2) / 2; d += `M${x1} ${y1}H${xm}V${y2}H${x2}`; }
  }
  const svg = box.querySelector('.wire'); svg.setAttribute('viewBox', `0 0 ${o.width} ${o.height}`); svg.querySelector('path').setAttribute('d', d);
}
function layoutGutter() {
  const sheet = $('#sheet'), top = sheet.getBoundingClientRect().top, g = $('#gutter');
  const lineMid = el => { const lh = parseFloat(getComputedStyle(el).lineHeight) || 22; return el.getBoundingClientRect().top - top + lh / 2; };
  const marks = [];
  entries.forEach(e => {
    const t = e.el.querySelector('.text');
    if (e === next) marks.push([lineMid(t), 'flag o-' + (e.keys[0] || 'form'), MARK.next]);
    else marks.push([lineMid(t), e.done ? 'o-form' : 'o-' + (e.keys[0] || 'form'), e.done ? MARK.done : MARK.open]);
  });
  unknowns.filter(u => !u.el.classList.contains('row')).forEach(u => marks.push([lineMid(u.el), '', MARK.unk, 'color:var(--pencil)']));
  g.innerHTML = marks.map(([y, cls, svg, style = '']) => `<span class="gm ${cls}" style="top:${(y - (cls.includes('flag') ? 10 : 8)).toFixed(1)}px;${style}">${svg}</span>`).join('');
}
function layout() { layoutLanes(); layoutGutter(); }
layout();
setTimeout(() => $('#gutter').classList.add('settled'), 1200);
new ResizeObserver(() => requestAnimationFrame(layout)).observe($('#sheet'));
narrow.addEventListener('change', layout);
document.fonts?.ready.then(layout);
</script>
</body>
</html>
